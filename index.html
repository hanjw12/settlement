<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self'; connect-src https://jzwilhkfgnmnacvopmfb.supabase.co; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<script>try { var t = localStorage.getItem('settlement-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>
<title>N빵 정산기</title>
<style>
:root {
  --bg: #f5f6f8; --card: #fff; --text: #1d2129; --muted: #6b7280; --line: #e5e7eb;
  --accent: #e6007e; --accent-soft: #fde7f3; --plus: #0a7d4f; --minus: #c62828;
  --chip-off: #f1f2f4; --shadow: 0 1px 3px rgba(0,0,0,.06); color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111317; --card: #1b1e24; --text: #e8eaed; --muted: #9aa0a6; --line: #2c3038;
    --accent: #ff4fa8; --accent-soft: #3a1a2c; --plus: #4cc38a; --minus: #ff6b6b; --chip-off: #262a31; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111317; --card: #1b1e24; --text: #e8eaed; --muted: #9aa0a6; --line: #2c3038;
  --accent: #ff4fa8; --accent-soft: #3a1a2c; --plus: #4cc38a; --minus: #ff6b6b; --chip-off: #262a31; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--text);
  font-family: Pretendard, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; font-size: 15px; }
main { max-width: 860px; margin: 0 auto; padding: 20px 16px 60px; }
.toolbar { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
.toolbar select { flex: 1; padding: 6px 10px; font-size: 14px; }
.sync { font-size: 13px; color: var(--muted); margin: 0 0 8px; display: flex; align-items: center; gap: 6px; }
.sync::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--plus); }
.sync.err::before { background: var(--minus); }
.sync.err { color: var(--minus); }
header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
header input { flex: 1; font-size: 22px; font-weight: 700; border: none; background: transparent; color: var(--text); padding: 4px 0; }
header input:focus { outline: none; border-bottom: 2px solid var(--accent); }
section { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow); }
h2 { font-size: 16px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
h2 .count { color: var(--muted); font-weight: 500; font-size: 14px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
input[type=text], input[type=number], select {
  font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
  border-radius: 10px; padding: 9px 11px; min-width: 0; }
input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
/* 기본 화살표는 어두운 배경에서 안 보이는 기기가 있어 직접 그린다 (CSP 때문에 이미지 대신 그라데이션) */
select { -webkit-appearance: none; appearance: none; padding-right: 30px;
  background-image: linear-gradient(45deg, transparent 50%, var(--text) 50%), linear-gradient(135deg, var(--text) 50%, transparent 50%);
  background-position: calc(100% - 17px) 50%, calc(100% - 12px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
#theme, .toolbar button { white-space: nowrap; }
@media (max-width: 640px) {
  .toolbar { flex-wrap: wrap; }
  .toolbar select { flex: 1 1 100%; }
  .toolbar button { flex: 1 1 auto; }
}
/* 금액 칸: 굵게 + 단위 표시 */
.money { position: relative; display: block; min-width: 0; }
.money input { width: 100%; font-weight: 700; font-size: 17px; text-align: right; padding-right: 32px; border-color: var(--accent); }
.money input::placeholder { font-weight: 500; font-size: 15px; }
.money::after { content: '원'; position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-weight: 700; color: var(--text); pointer-events: none; }
button { font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); padding: 9px 14px; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
button.ghost { background: transparent; color: var(--text); padding: 6px 10px; }
button.ghost:hover { color: var(--minus); border-color: var(--minus); }
button.small { padding: 5px 10px; font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px;
  border: 1.5px solid transparent; background: var(--chip-off); color: var(--muted); font-size: 14px; user-select: none; }
.chip .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
.chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--text); font-weight: 600; }
.person-chip { background: var(--chip-off); color: var(--text); padding-right: 4px; }
.person-chip button { border: none; background: transparent; padding: 0 6px; color: var(--muted); font-size: 16px; line-height: 1; }
.person-chip button:hover { color: var(--minus); }
.empty { color: var(--muted); font-size: 14px; padding: 8px 0; }

.add-form { display: grid; grid-template-columns: 1.4fr 1fr 1fr auto; gap: 8px; }
@media (max-width: 640px) { .add-form { grid-template-columns: 1fr 1fr; } .add-form .name-in, .add-form button { grid-column: 1 / -1; } }

.expense { border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-top: 10px; }
.expense-top { display: grid; grid-template-columns: 1.4fr 1fr 1fr auto; gap: 8px; align-items: center; }
@media (max-width: 640px) { .expense-top { grid-template-columns: 1fr 1fr auto; } .expense-top .name-in { grid-column: 1 / -1; } }
.expense-split { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px; }
.expense-split .label { font-size: 13px; color: var(--muted); margin-right: 4px; }
.expense-split .per { margin-left: auto; font-size: 13px; color: var(--muted); }
.warn { color: var(--minus); font-size: 13px; }
.num { text-align: right; font-variant-numeric: tabular-nums; }

table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { padding: 9px 6px; border-bottom: 1px solid var(--line); text-align: right; }
th:first-child, td:first-child { text-align: left; }
th { font-size: 13px; color: var(--muted); font-weight: 500; }
.plus { color: var(--plus); font-weight: 600; } .minus { color: var(--minus); font-weight: 600; }
.transfers { list-style: none; padding: 0; margin: 14px 0 0; display: grid; gap: 8px; }
.transfers li { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; background: var(--accent-soft); }
.transfers .arrow { color: var(--accent); font-weight: 700; }
.transfers .amt { margin-left: auto; font-weight: 700; font-size: 16px; }
.total-bar { display: flex; justify-content: space-between; color: var(--muted); font-size: 14px; margin-top: 12px; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text); color: var(--bg);
  padding: 10px 18px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
</style>
</head>
<body>
<main>
  <div class="toolbar">
    <select id="sheetSel" aria-label="정산 목록"></select>
    <button id="newSheet" class="small" type="button">+ 새 정산</button>
    <button id="liveShare" class="small primary" type="button" hidden>실시간 공유</button>
    <button id="share" class="small" type="button">링크 공유</button>
    <button id="delSheet" class="ghost small" type="button">삭제</button>
  </div>
  <div id="syncStatus" class="sync" hidden></div>
  <header>
    <input id="title" type="text" aria-label="정산 제목" placeholder="정산 제목 (예: 제주 여행)">
    <button id="theme" class="small" type="button"></button>
  </header>

  <section>
    <h2>① 참여자 <span class="count" id="peopleCount"></span></h2>
    <form id="personForm" class="row">
      <input id="personName" type="text" placeholder="이름 입력 후 Enter (쉼표로 여러 명)" style="flex:1">
      <button class="primary" type="submit">추가</button>
    </form>
    <div class="chips" id="people" style="margin-top:12px"></div>
  </section>

  <section>
    <h2>② 사용 금액 <span class="count" id="expenseCount"></span></h2>
    <form id="expenseForm" class="add-form">
      <input class="name-in" id="exName" type="text" placeholder="내용 (예: 1차 저녁)">
      <span class="money"><input id="exAmount" type="text" inputmode="numeric" placeholder="사용 금액" aria-label="사용 금액(원)"></span>
      <select id="exPayer" aria-label="결제자"></select>
      <button class="primary" type="submit">추가</button>
    </form>
    <div id="expenses"></div>
  </section>

  <section>
    <h2>③ 정산 결과</h2>
    <div id="result"></div>
  </section>
</main>
<div class="toast" id="toast"></div>

<script>
// 실시간 공유(Supabase). 둘 중 하나라도 비우면 실시간 기능이 숨겨지고
// 기존 방식(브라우저 저장 + 링크 공유)만 동작한다. 롤백할 때는 이 두 값을 비우면 된다.
// CSP 메타 태그의 connect-src 도 같은 주소로 맞춰야 한다.
const SUPABASE_URL = 'https://jzwilhkfgnmnacvopmfb.supabase.co';
const SUPABASE_KEY = 'sb_publishable_cdS0cFgPDgtDnZTirw9yQw_hMbWif9P';
const ONLINE = !!(SUPABASE_URL && SUPABASE_KEY);

const KEY = 'settlement-system-v2';
const OLD_KEY = 'settlement-system-v1';
const COLORS = ['#e6007e','#2f80ed','#27ae60','#f2994a','#9b51e0','#eb5757','#00a3a3','#c9a400','#6d4c41','#546e7a'];
const $ = id => document.getElementById(id);
const won = n => n.toLocaleString('ko-KR') + '원';
const uid = () => Math.random().toString(36).slice(2, 9);

// db: 저장된 정산 목록 전체, state: 지금 편집 중인 정산
let db = loadDb();
let state = db.sheets.find(s => s.id === db.current) || db.sheets[0];

function blank() { return { id: uid(), title: '', people: [], expenses: [] }; }
function loadDb() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d && Array.isArray(d.sheets) && d.sheets.length) return d;
  } catch (e) {}
  let first = blank();
  try {
    const old = JSON.parse(localStorage.getItem(OLD_KEY));
    if (old && Array.isArray(old.people) && Array.isArray(old.expenses)) first = { ...first, ...old, id: first.id };
  } catch (e) {}
  return { current: first.id, sheets: [first] };
}
function save() { db.current = state.id; try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} }
function commit() { save(); render(); if (state.room) runSync(); }
function select(sheet) { state = sheet; commit(); }

const person = id => state.people.find(p => p.id === id);
const clip = (v, max) => String(v == null ? '' : v).slice(0, max);
const MAX_AMOUNT = 1e12;
const parseAmount = v => Math.min(MAX_AMOUNT, Math.max(0, Math.round(Number(String(v).replace(/[^\d.]/g, '')) || 0)));

// 한 건을 대상자에게 균등 배분. 1원 단위 나머지는 대상자 순서대로 1원씩 더 부담.
function shares(ex) {
  const ids = state.people.map(p => p.id).filter(id => ex.members.includes(id));
  const out = {};
  if (!ids.length) return out;
  const base = Math.floor(ex.amount / ids.length);
  let rest = ex.amount - base * ids.length;
  ids.forEach(id => { out[id] = base + (rest-- > 0 ? 1 : 0); });
  return out;
}

function settle() {
  const bal = {}, paid = {}, owe = {};
  state.people.forEach(p => { paid[p.id] = 0; owe[p.id] = 0; });
  state.expenses.forEach(ex => {
    if (!person(ex.payer) || !ex.amount) return;
    const sh = shares(ex);
    if (!Object.keys(sh).length) return;
    paid[ex.payer] += ex.amount;
    for (const id in sh) owe[id] += sh[id];
  });
  state.people.forEach(p => { bal[p.id] = paid[p.id] - owe[p.id]; });

  // 받을 사람/보낼 사람을 큰 금액부터 매칭해 송금 횟수를 줄인다.
  const cred = state.people.filter(p => bal[p.id] > 0).map(p => ({ id: p.id, v: bal[p.id] })).sort((a, b) => b.v - a.v);
  const debt = state.people.filter(p => bal[p.id] < 0).map(p => ({ id: p.id, v: -bal[p.id] })).sort((a, b) => b.v - a.v);
  const transfers = [];
  let i = 0, j = 0;
  while (i < cred.length && j < debt.length) {
    const v = Math.min(cred[i].v, debt[j].v);
    transfers.push({ from: debt[j].id, to: cred[i].id, amount: v });
    cred[i].v -= v; debt[j].v -= v;
    if (!cred[i].v) i++;
    if (!debt[j].v) j++;
  }
  return { paid, owe, bal, transfers };
}

function chip(p, on, onClick) {
  const el = document.createElement('span');
  el.className = 'chip' + (on ? ' on' : '');
  el.style.setProperty('--c', p.color);
  el.setAttribute('role', 'checkbox');
  el.setAttribute('aria-checked', on);
  el.tabIndex = 0;
  el.innerHTML = '<span class="dot"></span>';
  el.append(p.name);
  el.onclick = onClick;
  el.onkeydown = e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); onClick(); } };
  return el;
}

function render() {
  const ss = $('sheetSel');
  ss.innerHTML = '';
  db.sheets.forEach(s => ss.append(new Option((s.title || '제목 없는 정산') + ` · ${s.people.length}명 ${s.expenses.length}건`, s.id)));
  ss.value = state.id;
  $('liveShare').hidden = !ONLINE;
  $('liveShare').textContent = state.room ? '실시간 링크 복사' : '실시간 공유';
  renderSync();

  $('title').value = state.title;
  $('peopleCount').textContent = state.people.length ? state.people.length + '명' : '';
  $('expenseCount').textContent = state.expenses.length ? state.expenses.length + '건' : '';

  // 참여자
  const pc = $('people');
  pc.innerHTML = '';
  if (!state.people.length) pc.innerHTML = '<div class="empty">정산할 사람을 먼저 추가하세요.</div>';
  state.people.forEach(p => {
    const el = document.createElement('span');
    el.className = 'chip person-chip';
    el.style.setProperty('--c', p.color);
    el.innerHTML = '<span class="dot"></span>';
    el.append(p.name);
    const x = document.createElement('button');
    x.type = 'button'; x.textContent = '×'; x.title = p.name + ' 삭제';
    x.onclick = () => removePerson(p.id);
    el.append(x);
    pc.append(el);
  });

  // 결제자 선택
  const sel = $('exPayer');
  const prev = sel.value;
  sel.innerHTML = '';
  state.people.forEach(p => sel.append(new Option(p.name + ' 결제', p.id)));
  if (person(prev)) sel.value = prev;

  // 지출 목록
  const ec = $('expenses');
  ec.innerHTML = '';
  if (!state.expenses.length) ec.innerHTML = '<div class="empty" style="margin-top:10px">금액 건을 추가하면 기본으로 전원이 대상자로 선택됩니다. 칩을 눌러 대상자를 바꾸세요.</div>';
  state.expenses.forEach(ex => ec.append(expenseRow(ex)));

  renderResult();
}

function expenseRow(ex) {
  const box = document.createElement('div');
  box.className = 'expense';
  const top = document.createElement('div');
  top.className = 'expense-top';

  const name = document.createElement('input');
  name.type = 'text'; name.className = 'name-in'; name.value = ex.name; name.placeholder = '내용';
  name.onchange = () => { ex.name = name.value.trim(); commit(); };

  const amt = document.createElement('input');
  amt.type = 'text'; amt.inputMode = 'numeric'; amt.className = 'num'; amt.value = ex.amount.toLocaleString('ko-KR');
  amt.setAttribute('aria-label', '사용 금액(원)');
  amt.onchange = () => { ex.amount = parseAmount(amt.value); commit(); };
  const money = document.createElement('span');
  money.className = 'money';
  money.append(amt);

  const payer = document.createElement('select');
  payer.setAttribute('aria-label', '결제자');
  state.people.forEach(p => payer.append(new Option(p.name + ' 결제', p.id)));
  if (!person(ex.payer)) payer.append(new Option('결제자 없음', ''));
  payer.value = person(ex.payer) ? ex.payer : '';
  payer.onchange = () => { ex.payer = payer.value; commit(); };

  const del = document.createElement('button');
  del.type = 'button'; del.className = 'ghost'; del.textContent = '삭제';
  del.onclick = () => { state.expenses = state.expenses.filter(e => e !== ex); commit(); };

  top.append(name, money, payer, del);

  const split = document.createElement('div');
  split.className = 'expense-split';
  split.innerHTML = '<span class="label">나눌 사람</span>';
  state.people.forEach(p => {
    const on = ex.members.includes(p.id);
    split.append(chip(p, on, () => {
      ex.members = on ? ex.members.filter(id => id !== p.id) : [...ex.members, p.id];
      commit();
    }));
  });
  const all = document.createElement('button');
  all.type = 'button'; all.className = 'small';
  const allOn = state.people.length && state.people.every(p => ex.members.includes(p.id));
  all.textContent = allOn ? '전체 해제' : '전체 선택';
  all.onclick = () => { ex.members = allOn ? [] : state.people.map(p => p.id); commit(); };
  split.append(all);

  const per = document.createElement('span');
  per.className = 'per';
  const n = state.people.filter(p => ex.members.includes(p.id)).length;
  if (!n) { per.className = 'per warn'; per.textContent = '대상자를 선택하세요 (정산에서 제외됨)'; }
  else if (!person(ex.payer)) { per.className = 'per warn'; per.textContent = '결제자를 선택하세요'; }
  else per.textContent = n + '명 · 1인 ' + won(Math.ceil(ex.amount / n)) + (ex.amount % n ? ' 내외' : '');
  split.append(per);

  box.append(top, split);
  return box;
}

function renderResult() {
  const r = $('result');
  if (!state.people.length || !state.expenses.length) {
    r.innerHTML = '<div class="empty">참여자와 사용 금액을 입력하면 자동으로 계산됩니다.</div>';
    return;
  }
  const { paid, owe, bal, transfers } = settle();
  const total = state.people.reduce((s, p) => s + paid[p.id], 0);

  let html = '<table><thead><tr><th>이름</th><th>낸 돈</th><th>부담할 돈</th><th>차액</th></tr></thead><tbody>';
  state.people.forEach(p => {
    const b = bal[p.id];
    html += `<tr><td>${esc(p.name)}</td><td>${won(paid[p.id])}</td><td>${won(owe[p.id])}</td>` +
      `<td class="${b > 0 ? 'plus' : b < 0 ? 'minus' : ''}">${b > 0 ? '+' : ''}${won(b)}</td></tr>`;
  });
  html += '</tbody></table>';
  html += `<div class="total-bar"><span>총 사용 금액</span><strong>${won(total)}</strong></div>`;

  if (transfers.length) {
    html += '<ul class="transfers">' + transfers.map(t =>
      `<li><strong>${esc(person(t.from).name)}</strong><span class="arrow">→</span><strong>${esc(person(t.to).name)}</strong><span class="amt">${won(t.amount)}</span></li>`
    ).join('') + '</ul>';
    html += '<div class="row" style="margin-top:12px;justify-content:flex-end"><button class="primary" id="copy" type="button">결과 복사</button></div>';
  } else {
    html += '<div class="empty" style="margin-top:12px">주고받을 돈이 없습니다.</div>';
  }
  r.innerHTML = html;
  if ($('copy')) $('copy').onclick = () => copyResult(transfers, total);
}

function copyResult(transfers, total) {
  const lines = [`[${state.title || '정산'}] 총 ${won(total)}`, ''];
  state.expenses.forEach(ex => {
    const names = state.people.filter(p => ex.members.includes(p.id)).map(p => p.name);
    if (!names.length || !person(ex.payer)) return;
    lines.push(`· ${ex.name || '항목'} ${won(ex.amount)} (${person(ex.payer).name} 결제 / ${names.join(', ')})`);
  });
  lines.push('');
  transfers.forEach(t => lines.push(`${person(t.from).name} → ${person(t.to).name} ${won(t.amount)}`));
  copyText(lines.join('\n'), '정산 결과를 복사했습니다');
}

function copyText(text, msg) {
  (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject())
    .then(() => toast(msg))
    .catch(() => { prompt('아래 내용을 복사하세요', text); });
}

// 공유 링크: 정산 내용을 압축해 URL 해시(#s=...)에 담는다. 서버 저장 없음.
// 링크는 누구나 만들 수 있으므로 읽을 때 크기·개수를 제한한다.
const MAX_LINK = 20000, MAX_JSON = 1 << 20, MAX_PEOPLE = 100, MAX_EXPENSES = 1000;
function b64url(bytes) {
  let bin = '';
  bytes.forEach(b => { bin += String.fromCharCode(b); });
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function unb64url(str) {
  const bin = atob(str.replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from(bin, c => c.charCodeAt(0));
}
async function pipe(bytes, stream, limit = Infinity) {
  const reader = new Blob([bytes]).stream().pipeThrough(stream).getReader();
  const chunks = [];
  let size = 0;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    size += value.length;
    if (size > limit) { reader.cancel(); throw new Error('too large'); }
    chunks.push(value);
  }
  const out = new Uint8Array(size);
  let off = 0;
  chunks.forEach(c => { out.set(c, off); off += c.length; });
  return out;
}
async function encodeSheet(s) {
  const idx = Object.fromEntries(s.people.map((p, i) => [p.id, i]));
  const data = {
    i: s.id, t: s.title,
    p: s.people.map(p => [p.name, p.color]),
    e: s.expenses.map(ex => [ex.name, ex.amount, idx[ex.payer] ?? -1, ex.members.filter(m => m in idx).map(m => idx[m])])
  };
  const bytes = new TextEncoder().encode(JSON.stringify(data));
  if (window.CompressionStream) return 'z' + b64url(await pipe(bytes, new CompressionStream('deflate-raw')));
  return 'j' + b64url(bytes);
}
async function decodeSheet(str) {
  if (str.length > MAX_LINK) throw new Error('too large');
  let bytes = unb64url(str.slice(1));
  if (str[0] === 'z') bytes = await pipe(bytes, new DecompressionStream('deflate-raw'), MAX_JSON);
  const d = JSON.parse(new TextDecoder().decode(bytes));
  if (!Array.isArray(d.p) || !Array.isArray(d.e) || d.p.length > MAX_PEOPLE || d.e.length > MAX_EXPENSES) throw new Error('bad data');
  const people = d.p.map(([name, color], i) => ({ id: uid(), name: clip(name, 40), color: COLORS.includes(color) ? color : COLORS[i % COLORS.length], pos: i }));
  const expenses = d.e.map(([name, amount, pi, ms], i) => ({
    id: uid(), name: clip(name, 100), amount: parseAmount(amount), pos: i,
    payer: people[pi] ? people[pi].id : '',
    members: (Array.isArray(ms) ? ms : []).map(i => people[i] && people[i].id).filter(Boolean)
  }));
  return { id: typeof d.i === 'string' && /^\w{1,20}$/.test(d.i) ? d.i : uid(), title: clip(d.t, 100), people, expenses };
}

// 실시간 공유: 정산 하나가 Supabase 의 공유방(room) 하나에 대응한다.
// 마지막으로 서버와 맞춘 상태(synced)와 비교해 바뀐 행만 올리고, 서버가 바뀌었으면 다시 받아온다.
// 같은 건을 동시에 고치면 나중에 저장한 쪽이 남는다.
const POLL_MS = 3000;
const sync = { busy: false, again: false, error: '', pendingRender: false };

function roomId() { return b64url(crypto.getRandomValues(new Uint8Array(16))); }
function roomLink(r) { return location.href.split('#')[0] + '#r=' + r; }

async function api(room, method, path, body, prefer) {
  const headers = { apikey: SUPABASE_KEY, 'x-room-id': room };
  if (body) headers['Content-Type'] = 'application/json';
  if (prefer) headers.Prefer = prefer;
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, { method, headers, body: body ? JSON.stringify(body) : undefined, cache: 'no-store' });
  if (!res.ok) throw new Error(res.status + ' ' + (await res.text()).slice(0, 200));
  return (res.headers.get('content-type') || '').includes('json') && res.status !== 204 ? res.json() : null;
}

function rowsOf(s) {
  return {
    title: s.title,
    people: Object.fromEntries(s.people.map(p => [p.id, JSON.stringify([p.name, p.color, p.pos ?? 0])])),
    expenses: Object.fromEntries(s.expenses.map(e => [e.id, JSON.stringify([e.name, e.amount, e.payer, e.members, e.pos ?? 0])]))
  };
}

async function push(s) {
  const now = rowsOf(s), base = s.synced || { title: null, people: {}, expenses: {} }, r = s.room;
  if (now.title !== base.title) await api(r, 'PATCH', 'rooms?id=eq.' + r, { title: s.title }, 'return=minimal');
  const tables = [
    ['people', s.people, p => ({ room_id: r, id: p.id, name: p.name, color: p.color, pos: p.pos ?? 0 })],
    ['expenses', s.expenses, e => ({ room_id: r, id: e.id, name: e.name, amount: e.amount, payer: e.payer, members: e.members, pos: e.pos ?? 0 })]
  ];
  for (const [table, items, toRow] of tables) {
    const changed = items.filter(x => now[table][x.id] !== base[table][x.id]).map(toRow);
    const gone = Object.keys(base[table]).filter(id => !(id in now[table]));
    if (changed.length) await api(r, 'POST', table + '?on_conflict=room_id,id', changed, 'resolution=merge-duplicates,return=minimal');
    if (gone.length) await api(r, 'DELETE', table + '?id=in.(' + gone.map(encodeURIComponent).join(',') + ')', null, 'return=minimal');
  }
  return now;
}

// 서버의 방이 마지막으로 받은 뒤 바뀌었을 때만 전체를 받아온다
async function fetchRoom(s) {
  const r = s.room;
  const [room] = await api(r, 'GET', 'rooms?select=title,updated_at&id=eq.' + r);
  if (!room) throw new Error('not found');
  if (room.updated_at === s.stamp) return null;
  const [people, expenses] = await Promise.all([
    api(r, 'GET', 'people?select=id,name,color,pos&order=pos,id'),
    api(r, 'GET', 'expenses?select=id,name,amount,payer,members,pos&order=pos,id')
  ]);
  return { room, people, expenses };
}

function applyRemote(s, { room, people, expenses }) {
  const before = JSON.stringify(rowsOf(s));
  // 기존 객체를 제자리에서 고친다. 화면의 입력칸 핸들러가 그 객체를 붙잡고 있어서,
  // 새 객체로 바꾸면 입력 중이던 수정이 떨어져 나간 객체에 저장되어 사라진다.
  const keep = (old, fresh) => fresh.map(x => { const o = old.find(y => y.id === x.id); return o ? Object.assign(o, x) : x; });
  s.title = clip(room.title, 100);
  s.people = keep(s.people, people.map((p, i) => ({ id: clip(p.id, 20), name: clip(p.name, 40), color: COLORS.includes(p.color) ? p.color : COLORS[i % COLORS.length], pos: Number(p.pos) || 0 })));
  s.expenses = keep(s.expenses, expenses.map(e => ({
    id: clip(e.id, 20), name: clip(e.name, 100), amount: parseAmount(e.amount), payer: clip(e.payer, 20),
    members: (Array.isArray(e.members) ? e.members : []).map(m => clip(m, 20)), pos: Number(e.pos) || 0
  })));
  s.stamp = room.updated_at;
  s.synced = rowsOf(s);
  return JSON.stringify(s.synced) !== before;
}

async function runSync() {
  const s = state;
  if (!ONLINE || !s.room) return;
  if (sync.busy) { sync.again = true; return; }
  sync.busy = true;
  let changed = false;
  try {
    do {
      sync.again = false;
      s.synced = await push(s);
      const remote = await fetchRoom(s);
      if (sync.again) continue; // 받는 사이 로컬 수정이 생기면 그것부터 올린다
      if (remote) changed = applyRemote(s, remote) || changed;
    } while (sync.again);
    sync.error = '';
  } catch (e) {
    sync.error = /not found/.test(e.message) ? '공유방을 찾을 수 없습니다' : '연결 끊김 · 다시 연결 중…';
  }
  sync.busy = false;
  save();
  if (changed && s === state) renderRemote(); else renderSync();
}

// 다른 사람의 수정이 들어와도 지금 입력 중인 칸은 덮어쓰지 않는다
function renderRemote() {
  const a = document.activeElement;
  if (a && (a.id === 'title' || a.closest('#expenses'))) { sync.pendingRender = true; renderSync(); return; }
  render();
}
document.addEventListener('focusout', () => setTimeout(() => {
  if (sync.pendingRender) { sync.pendingRender = false; renderRemote(); }
}, 0));

function renderSync() {
  const el = $('syncStatus');
  el.hidden = !(ONLINE && state.room);
  el.classList.toggle('err', !!sync.error);
  el.textContent = sync.error || '실시간 공유 중 · 링크를 받은 사람과 함께 편집됩니다';
}

async function startLive() {
  const s = state;
  if (!s.room) {
    if (!s.people.length) { toast('참여자를 먼저 추가하세요'); return; }
    const r = roomId();
    try { await api(r, 'POST', 'rooms', { id: r, title: s.title }, 'return=minimal'); }
    catch (e) { toast('실시간 공유를 시작하지 못했습니다'); return; }
    s.people.forEach((p, i) => { if (p.pos == null) p.pos = i; });
    s.expenses.forEach((e, i) => { if (e.pos == null) e.pos = i; });
    s.room = r; s.synced = null; s.stamp = null;
    commit();
  }
  copyText(roomLink(s.room), '실시간 링크를 복사했습니다 · 링크를 가진 누구나 함께 수정할 수 있어요');
}

function joinRoom(r) {
  if (!ONLINE) { toast('실시간 공유가 꺼져 있습니다'); return; }
  let s = db.sheets.find(x => x.room === r);
  if (!s) {
    s = { ...blank(), room: r, stamp: null };
    s.synced = rowsOf(s); // 빈 상태를 기준으로 삼아 아무것도 올리지 않고 받기만 한다
    db.sheets = db.sheets.filter(x => x.title || x.people.length || x.expenses.length);
    db.sheets.unshift(s);
  }
  select(s);
}

async function importFromHash() {
  const live = location.hash.match(/^#r=([\w-]{20,40})$/);
  const m = location.hash.match(/^#s=([\w-]+)$/);
  if (!m && !live) return;
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { location.hash = ''; }
  if (live) { joinRoom(live[1]); return; }
  let s;
  try { s = await decodeSheet(m[1]); } catch (e) { toast('공유 링크를 읽을 수 없습니다'); return; }
  // 아무것도 입력하지 않은 빈 정산은 공유본으로 대체
  db.sheets = db.sheets.filter(x => x.title || x.people.length || x.expenses.length);
  const i = db.sheets.findIndex(x => x.id === s.id);
  if (i < 0) db.sheets.unshift(s);
  else if (confirm(`이미 저장된 "${db.sheets[i].title || '제목 없는 정산'}"을(를) 공유받은 내용으로 덮어쓸까요?\n취소하면 사본으로 추가합니다.`)) db.sheets[i] = s;
  else { s.id = uid(); s.title = (s.title || '정산') + ' (공유본)'; db.sheets.unshift(s); }
  select(s);
  toast('공유받은 정산을 불러왔습니다');
}

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), msg.length > 20 ? 3000 : 1600); }

function removePerson(id) {
  const used = state.expenses.some(ex => ex.payer === id);
  if (used && !confirm(person(id).name + '님이 결제한 건이 있습니다. 삭제하면 해당 건의 결제자가 비게 됩니다. 삭제할까요?')) return;
  state.people = state.people.filter(p => p.id !== id);
  state.expenses.forEach(ex => {
    ex.members = ex.members.filter(m => m !== id);
    if (ex.payer === id) ex.payer = '';
  });
  commit();
}

$('personForm').onsubmit = e => {
  e.preventDefault();
  const names = $('personName').value.split(',').map(s => s.trim()).filter(Boolean);
  names.forEach((name, i) => {
    name = clip(name, 40);
    if (state.people.some(p => p.name === name)) return;
    const color = COLORS[state.people.length % COLORS.length];
    state.people.push({ id: uid(), name, color, pos: Date.now() + i });
  });
  $('personName').value = '';
  commit();
  $('personName').focus();
};

$('expenseForm').onsubmit = e => {
  e.preventDefault();
  if (!state.people.length) { toast('참여자를 먼저 추가하세요'); $('personName').focus(); return; }
  const amount = parseAmount($('exAmount').value);
  if (!amount) { toast('금액을 입력하세요'); $('exAmount').focus(); return; }
  state.expenses.push({
    id: uid(), name: clip($('exName').value.trim(), 100) || ('항목 ' + (state.expenses.length + 1)),
    amount, payer: $('exPayer').value, members: state.people.map(p => p.id), pos: Date.now()
  });
  $('exName').value = ''; $('exAmount').value = '';
  commit();
  $('exName').focus();
};

$('exAmount').oninput = e => {
  const n = parseAmount(e.target.value);
  e.target.value = n ? n.toLocaleString('ko-KR') : '';
};
$('title').onchange = e => { state.title = e.target.value.trim(); commit(); };
$('sheetSel').onchange = e => select(db.sheets.find(s => s.id === e.target.value));
$('newSheet').onclick = () => {
  const s = blank();
  db.sheets.unshift(s);
  select(s);
  $('title').focus();
};
$('delSheet').onclick = () => {
  const note = state.room ? '\n내 목록에서만 지워지고, 함께 쓰는 사람들의 공유방은 그대로 남습니다.' : '';
  if ((state.people.length || state.expenses.length) && !confirm(`"${state.title || '제목 없는 정산'}"을(를) 삭제할까요?${note}`)) return;
  db.sheets = db.sheets.filter(s => s !== state);
  if (!db.sheets.length) db.sheets.push(blank());
  select(db.sheets[0]);
};
$('share').onclick = async () => {
  if (!state.people.length) { toast('공유할 내용이 없습니다'); return; }
  copyText(location.href.split('#')[0] + '#s=' + await encodeSheet(state), '링크를 복사했습니다 · 링크를 가진 누구나 내용을 볼 수 있어요');
};
// 테마: 처음에는 휴대폰 설정을 따르고, 버튼으로 고르면 이 기기에 기억한다
const darkQuery = matchMedia('(prefers-color-scheme: dark)');
const isDark = () => (document.documentElement.dataset.theme || (darkQuery.matches ? 'dark' : 'light')) === 'dark';
function renderTheme() {
  $('theme').textContent = isDark() ? '☀️ 밝게' : '🌙 어둡게';
  $('theme').setAttribute('aria-label', isDark() ? '밝은 테마로 전환' : '어두운 테마로 전환');
}
$('theme').onclick = () => {
  const t = isDark() ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem('settlement-theme', t); } catch (e) {}
  renderTheme();
};
darkQuery.addEventListener('change', renderTheme);
renderTheme();

$('liveShare').onclick = startLive;
window.addEventListener('hashchange', importFromHash);
if (ONLINE) {
  setInterval(() => { if (!document.hidden) runSync(); }, POLL_MS);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) runSync(); });
}

render();
importFromHash();
runSync();
</script>
</body>
</html>
